<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>CEO for a Day Live</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Archivo:wght@400;600;800&display=swap">
<style>
/* Layout: a quiz-show stage on a brick baseplate. Top bar = progress, centre = the round, bottom = four team bricks + host console. Single dark look by design. */
:root {
  --stage: #151b3d;
  --stage-2: #1f2754;
  --stage-3: #2a3468;
  --ink: #f7f4ec;
  --muted: #aeb5dc;
  --red: #e2382f;
  --blue: #2477e0;
  --yellow: #f6c31c;
  --green: #22a35a;
  --gold: #ffd23f;
  --good: #3ad07a;
  --bad: #ff6b5e;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --body: "Archivo", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--stage);
  background-image: radial-gradient(circle at 12px 12px, rgba(255,255,255,.045) 0 7px, transparent 8px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  overflow-x: hidden;
}
.app {
  min-height: 100%;
  box-sizing: border-box;
  display: grid;
  grid-template-rows: auto 1fr auto auto;
  gap: 16px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  grid-template-columns: minmax(0, 1fr);
  max-width: 1600px;
  margin: 0 auto;
}
button { font-family: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* top bar */
.top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-size: 20px; letter-spacing: .02em; }
.brand span { color: var(--gold); }
.progress { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; justify-content: center; }
.pill { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; background: var(--stage-2); color: var(--muted); }
.pill.on { background: var(--gold); color: var(--stage); }
.pill.done { color: var(--ink); }
.hostchip { font-size: 14px; font-weight: 600; color: var(--muted); }
.hostchip b { color: var(--ink); }

/* stage */
.stage { min-height: 0; display: grid; }
.screen.enter { animation: rise .45s ease both; }
.screen { display: grid; grid-template-columns: minmax(0, 1fr); align-content: center; gap: 24px; }
@keyframes rise { from { transform: translateY(14px); opacity: .001; } to { transform: none; opacity: 1; } }

.eyebrow { font-size: 15px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.mega { overflow-wrap: anywhere; font-family: var(--display); font-size: clamp(36px, 7.5vw, 112px); line-height: .95; margin: 0; text-wrap: balance; }
.mega .y { color: var(--gold); }
.lede { font-size: clamp(18px, 1.8vw, 26px); color: var(--muted); max-width: 58ch; margin: 0; line-height: 1.4; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.rule { background: var(--stage-2); border-radius: 14px; padding: 16px; }
.rule b { display: block; font-family: var(--display); font-size: 26px; color: var(--gold); }
.big-btn { font-family: var(--display); font-size: clamp(22px, 2.4vw, 34px); padding: 18px 34px; border: 0; border-radius: 16px; background: var(--gold); color: var(--stage); box-shadow: 0 6px 0 #b48d10; justify-self: start; }
.big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b48d10; }

.stats { display: flex; flex-wrap: wrap; gap: 12px; }
.stat { background: var(--stage-2); border-radius: 14px; padding: 14px 18px; }
.stat b { font-family: var(--display); font-size: 30px; color: var(--gold); display: block; }

.namegrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.namegrid label { display: grid; gap: 6px; font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.namegrid input { font: 600 20px var(--body); padding: 12px; border-radius: 12px; border: 3px solid var(--c); background: var(--stage-2); color: var(--ink); min-width: 0; }

/* question */
.qwrap { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: center; }
.qcard { display: grid; gap: 18px; }
.qtext { overflow-wrap: anywhere; font-family: var(--display); font-size: clamp(22px, 3.3vw, 50px); line-height: 1.08; margin: 0; text-wrap: balance; }
.opts { display: grid; gap: 12px; }
.opt { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; background: var(--stage-2); border-radius: 16px; padding: 14px 18px; font-size: clamp(18px, 1.9vw, 28px); font-weight: 600; transition: background .3s, opacity .3s, transform .3s; }
.opt .n { font-family: var(--display); width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: var(--stage-3); color: var(--gold); font-size: 26px; }
.opt .who { display: flex; gap: 6px; }
.opt .who i { width: 18px; height: 18px; border-radius: 5px; background: var(--c); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
.opt.right { background: var(--good); color: #08240f; transform: scale(1.02); }
.opt.right .n { background: #0f5a2b; color: #fff; }
.opt.dim { opacity: .38; }
.lightning-opts { grid-template-columns: 1fr 1fr; }
.lightning-opts .opt { font-family: var(--display); font-size: clamp(28px, 3.4vw, 54px); grid-template-columns: auto 1fr auto; }

.ring { position: relative; width: clamp(150px, 15vw, 230px); aspect-ratio: 1; max-width: 100%; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { fill: none; stroke: var(--stage-2); stroke-width: 12; }
.ring .bar { fill: none; stroke: var(--gold); stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset .25s linear, stroke .3s; }
.ring.hot .bar { stroke: var(--bad); }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: clamp(48px, 5vw, 80px); font-variant-numeric: tabular-nums; }
.ring .cap { position: absolute; left: 0; right: 0; bottom: 18%; text-align: center; font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.ring.hot .num { color: var(--bad); animation: pulse .5s ease infinite alternate; }
@keyframes pulse { to { transform: scale(1.08); } }

.screen.enter .fact { animation: rise .4s ease both; }
.fact { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: start; background: var(--ink); color: var(--stage); border-radius: 16px; padding: 16px 20px; }
.fact .tag { font-family: var(--display); font-size: 15px; background: var(--stage); color: var(--gold); padding: 8px 10px; border-radius: 10px; white-space: nowrap; }
.fact p { margin: 0; font-size: clamp(16px, 1.5vw, 22px); line-height: 1.35; }
.fact p + p { margin-top: 6px; font-weight: 800; }
.fact small { display: block; margin-top: 6px; font-size: 13px; color: #4b5280; }

/* teams */
.teams { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.team { position: relative; background: var(--c); color: #fff; border-radius: 14px; padding: 22px 14px 12px; box-shadow: inset 0 -6px 0 rgba(0,0,0,.22); display: grid; gap: 8px; transition: transform .2s, outline-color .2s; outline: 4px solid transparent; outline-offset: 3px; }
.team.yel { color: #2b2100; }
.team::before { content: ""; position: absolute; top: -9px; left: 18%; right: 18%; height: 14px; background: radial-gradient(circle at 25% 50%, var(--c) 0 9px, transparent 10px), radial-gradient(circle at 75% 50%, var(--c) 0 9px, transparent 10px); filter: brightness(1.12); }
.team.sel { outline-color: var(--ink); transform: translateY(-4px); }
.team .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.team .nm { font-weight: 800; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.team .sc { font-family: var(--display); font-size: clamp(24px, 2.4vw, 36px); font-variant-numeric: tabular-nums; }
.team .crown { position: absolute; top: -30px; right: 10px; font-size: 26px; animation: bob 1s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(-4px) rotate(8deg); } }
.team .btns { display: flex; gap: 6px; }
.team .btns button { flex: 1; min-width: 0; font: 800 18px var(--body); padding: 8px 0; border-radius: 10px; border: 2px solid rgba(255,255,255,.55); background: rgba(0,0,0,.18); color: inherit; }
.team.yel .btns button { border-color: rgba(43,33,0,.45); }
.team .btns button.on { background: var(--ink); color: var(--stage); border-color: var(--ink); }
.team .btns button:disabled { cursor: default; opacity: .65; }
.team .order { position: absolute; top: 6px; left: 10px; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; opacity: .9; }
.team .delta { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-family: var(--display); font-size: 26px; color: var(--gold); text-shadow: 0 3px 0 rgba(0,0,0,.4); animation: pop 1.6s ease both; white-space: nowrap; }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.6); } 20% { opacity: 1; transform: translate(-50%, -10px) scale(1.15); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -36px); } }

/* podium */
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: end; max-width: 980px; width: 100%; justify-self: center; }
.place { display: grid; gap: 10px; justify-items: center; text-align: center; }
.place .blk { width: 100%; border-radius: 14px 14px 0 0; background: var(--c); display: grid; place-items: center; font-family: var(--display); font-size: clamp(40px, 5vw, 76px); color: rgba(255,255,255,.92); box-shadow: inset 0 -8px 0 rgba(0,0,0,.25); animation: grow .9s cubic-bezier(.2,.9,.3,1.2) both; transform-origin: bottom; }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.place .pn { font-weight: 800; font-size: clamp(18px, 2vw, 28px); }
.place .ps { font-family: var(--display); font-size: clamp(22px, 2.4vw, 34px); color: var(--gold); }
.also { text-align: center; color: var(--muted); font-size: 18px; }

.chips { display: flex; flex-wrap: wrap; gap: 12px; }
.chip { background: var(--stage-2); border-radius: 14px; padding: 14px 18px; display: grid; gap: 4px; min-width: 0; }
.chip b { font-family: var(--display); color: var(--gold); font-size: 22px; }

/* console */
.console { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--stage-2); border-radius: 16px; padding: 10px 12px; }
.console .say { flex: 1 1 320px; min-width: 0; font-size: 15px; color: var(--muted); line-height: 1.35; }
.console .say b { color: var(--ink); }
.cbtn { font-weight: 800; font-size: 15px; padding: 10px 14px; border-radius: 12px; border: 0; background: var(--stage-3); color: var(--ink); }
.cbtn.primary { background: var(--gold); color: var(--stage); font-size: 17px; padding: 12px 20px; }
.cbtn:disabled { opacity: .4; cursor: default; }
.vol { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.vol input { width: 90px; accent-color: var(--gold); }
.keys { font-size: 12px; color: var(--muted); width: 100%; }
kbd { font: 700 11px var(--body); background: var(--stage-3); padding: 2px 6px; border-radius: 5px; color: var(--ink); }

/* phone join */
.joinwrap { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: center; }
.qrcard { background: var(--ink); color: var(--stage); border-radius: 18px; padding: 18px; display: grid; gap: 10px; justify-items: center; text-align: center; width: min(300px, 100%); box-sizing: border-box; }
.qrcard img { width: 100%; max-width: 240px; height: auto; image-rendering: pixelated; }
.qrcard .code { font-family: var(--display); font-size: 40px; letter-spacing: .12em; }
.qrcard .url { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; color: #4b5280; }
.qrcard .msg { font-size: 15px; font-weight: 800; }
.netchip { font-size: 13px; font-weight: 800; padding: 6px 10px; border-radius: 999px; background: var(--stage-2); color: var(--muted); }
.netchip.ok { color: var(--good); }
.netchip.bad { color: var(--bad); }
.team .ph { position: absolute; top: 6px; right: 10px; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; opacity: .9; }
.team .ph.off { opacity: .5; }
.urlrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.urlrow input { flex: 1 1 260px; min-width: 0; font: 600 14px var(--body); padding: 8px 10px; border-radius: 10px; border: 2px solid var(--stage-3); background: var(--stage-2); color: var(--ink); }

#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; width: 100%; height: 100%; }

@media (max-width: 760px) {
  .qwrap, .joinwrap { grid-template-columns: minmax(0, 1fr); }
  .ring { justify-self: center; }
  .teams, .namegrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lightning-opts { grid-template-columns: 1fr; }
  .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition: none !important; }
}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">CEO for a Day <span>·</span> The Brick Crisis</div>
    <nav class="progress" id="progress" aria-label="Game progress"></nav>
    <div class="netchip" id="netchip">Phones: connecting…</div>
    <div class="hostchip" id="hostchip"></div>
  </header>
  <main class="stage" id="stage" aria-live="polite"></main>
  <section class="teams" id="teams" aria-label="Team scores"></section>
  <footer class="console" id="console">
    <div class="say" id="say"></div>
    <button class="cbtn" id="btnBack" type="button">◂ Back</button>
    <button class="cbtn" id="btnUndo" type="button">Undo</button>
    <button class="cbtn primary" id="btnNext" type="button">Next ▸</button>
    <button class="cbtn" id="btnMute" type="button">Mute</button>
    <label class="vol" for="vol">Vol <input id="vol" type="range" min="0" max="1" step="0.05" value="0.8"></label>
    <button class="cbtn" id="btnFull" type="button">Full screen</button>
    <div class="keys"><kbd>Space</kbd> next · <kbd>←</kbd> back · <kbd>R</kbd><kbd>B</kbd><kbd>Y</kbd><kbd>G</kbd> pick team, then <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> answer · <kbd>U</kbd> undo · <kbd>M</kbd> mute · <kbd>S</kbd> skip rest of lightning · <kbd>F</kbd> full screen</div>
  </footer>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div id="qrtmp" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script>
(() => {
  // ---------- content (every fact is from the Group 5 deck's verified sources) ----------
  const Q = [
    { tag: "KA11 · Decide", round: "Round 1 · Decide", host: "Ahmad", time: 20,
      q: "LEGO is doing too many things at once: theme parks, video games, jewelry, education centers. What do you do?",
      opts: ["Launch even more new products to find a hit", "Cut back and focus on the core brick", "Wait for the market to recover"],
      correct: 1,
      fact: "LEGO sold 70% of its Legoland parks (€375m), closed plants and cut complexity. It was back to profit in 2005: DKK 505m.",
      theory: "Escalation of commitment: stop paying for an idea just because you started it.",
      src: "Knowledge at Wharton (2012); AP via NBC News (15 Feb 2006)",
      ask: "<b>Ahmad:</b> “Every team is LEGO’s new CEO. Your company is doing too many things at once. Spokespeople, get your phones ready!”" },
    { tag: "KA12 · Influence", round: "Round 2 · Influence", host: "Hung", time: 20,
      q: "You need new product ideas, fast. Who do you ask?",
      opts: ["Only your top managers", "An outside agency", "Your adult fans, before a prototype even exists"],
      correct: 2,
      fact: "LEGO invited adult fans to help design the Mindstorms NXT robot before a working prototype existed. It launched in 2006.",
      theory: "Consultation builds commitment. Sharing power multiplies ideas.",
      src: "RobotShop/Wired (2006)",
      ask: "<b>Hung:</b> “The bank account is empty and you need ideas, fast. Who do you ask? Tap fast!”" },
    { tag: "KA13 · Lead", round: "Round 3 · Lead", host: "Sandra", time: 20,
      q: "Your people are scared. How do you lead them now?",
      opts: ["Strict control: tell everyone exactly what to do", "“I don’t want to control. I want to create context.”", "Stay in the background and let teams sort it out"],
      correct: 1,
      fact: "These are the words of Jørgen Vig Knudstorp, the CEO who led LEGO’s turnaround from 2004 to 2017.",
      theory: "Give purpose and support, not fear. Passive leadership leaves people alone in a crisis.",
      src: "Freeland, BCG interview with Knudstorp (2017)",
      ask: "<b>Sandra:</b> “Last decision, CEOs. Your people are scared. How do you lead them?”" },
    { tag: "Lightning · ×2", host: "Hung", time: 10, lightning: true,
      q: "Managers were afraid of their bosses, so bad news never reached the top.",
      opts: ["LEGO", "Nokia"], correct: 1,
      fact: "Vuori & Huy studied Nokia’s smartphone decline: shared fear made managers hide bad news.",
      theory: "Fear-based power creates silence.",
      src: "Vuori & Huy (2016), Administrative Science Quarterly 61(1)",
      ask: "<b>Hung:</b> “LEGO or Nokia? Tap it. Ten seconds!”" },
    { tag: "Lightning · ×2", host: "Hung", time: 10, lightning: true,
      q: "A fan’s product idea needs 10,000 supporters before the company reviews it.",
      opts: ["LEGO", "Nokia"], correct: 0,
      fact: "LEGO Ideas: if a fan’s set is made, the fan earns 1% of its net revenue.",
      theory: "Crowdsourcing turns customers into co-creators.",
      src: "Kinicki & Fugate (2021), p. 356",
      ask: "<b>Hung:</b> “Next one. LEGO or Nokia?”" },
    { tag: "Lightning · ×2", host: "Hung", time: 10, lightning: true,
      q: "It sold its phone business to Microsoft in 2013.",
      opts: ["LEGO", "Nokia"], correct: 1,
      fact: "The €5.44bn deal came two years after the famous “burning platform” memo.",
      theory: "When ideas stop flowing up, the company runs out of options.",
      src: "Reuters via Bangor Daily News (3 Sep 2013)",
      ask: "<b>Hung:</b> “Who sold its phones to Microsoft?”" },
    { tag: "Lightning · ×2", host: "Sandra", time: 10, lightning: true,
      q: "It opened a solar-powered factory in Vietnam in 2025.",
      opts: ["LEGO", "Nokia"], correct: 0,
      fact: "Binh Duong, Vietnam: over US$1bn invested and 12,400 rooftop solar panels.",
      theory: "The next crisis is environmental, and it needs the same creative leadership.",
      src: "Viet Nam Government News (10 Apr 2025)",
      ask: "<b>Sandra:</b> “Last one, and it’s in ASEAN. LEGO or Nokia?”" },
  ];
  const TEAMS = [
    { id: "R", key: "r", label: "Red", c: "var(--red)", cls: "" },
    { id: "B", key: "b", label: "Blue", c: "var(--blue)", cls: "" },
    { id: "Y", key: "y", label: "Yellow", c: "var(--yellow)", cls: "yel" },
    { id: "G", key: "g", label: "Green", c: "var(--green)", cls: "" },
  ];
  const STEPS = [
    { s: "start", pill: "Start", host: "Ahmad" },
    { s: "teams", pill: "Teams", host: "Ahmad" },
    { s: "q", i: 0, pill: "R1" }, { s: "q", i: 1, pill: "R2" }, { s: "q", i: 2, pill: "R3" },
    { s: "lintro", pill: "Lightning", host: "Hung" },
    { s: "q", i: 3, pill: "L1" }, { s: "q", i: 4, pill: "L2" }, { s: "q", i: 5, pill: "L3" }, { s: "q", i: 6, pill: "L4" },
    { s: "podium", pill: "Podium", host: "Sandra" },
    { s: "bridge", pill: "Slides", host: "Sandra" },
  ];

  // ---------- state ----------
  let state = { step: 0, phase: "ask", names: { R: "Red Team", B: "Blue Team", Y: "Yellow Team", G: "Green Team" }, answers: {}, revealed: {}, sel: null, muted: false, vol: 0.8 };
  let undoStack = [];
  let timer = { left: 0, dur: 0, id: null, t0: 0, lastTick: null };
  let lastDelta = null, lastKey = "";

  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t).replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));

  // ---------- scoring ----------
  function delta(qi) {
    const q = Q[qi], a = state.answers[qi] || {}, out = {};
    const right = TEAMS.filter((t) => a[t.id] && a[t.id].o === q.correct);
    let first = null;
    right.forEach((t) => { if (!first || a[t.id].t < a[first].t) first = t.id; });
    TEAMS.forEach((t) => {
      let p = 0;
      if (right.includes(t)) p = (q.lightning ? 200 : 100) + (t.id === first ? (q.lightning ? 100 : 50) : 0);
      out[t.id] = { p, first: t.id === first };
    });
    return out;
  }
  function scores() {
    const sc = { R: 0, B: 0, Y: 0, G: 0 };
    Object.keys(state.revealed).forEach((qi) => { const d = delta(+qi); TEAMS.forEach((t) => (sc[t.id] += d[t.id].p)); });
    return sc;
  }

  // ---------- audio (all synthesized; no files) ----------
  const A = { ctx: null, master: null, music: null, sfx: null, noise: null, tempo: 124, step: 0, next: 0, id: null, mood: "off" };
  const mf = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function audioInit() {
    if (A.ctx) { if (A.ctx.state === "suspended") A.ctx.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    A.ctx = new C();
    A.master = A.ctx.createGain(); A.master.gain.value = state.muted ? 0 : state.vol; A.master.connect(A.ctx.destination);

  // ---------- timer ----------

  // ---------- phones (PeerJS relay; the game still runs by hand if this fails) ----------
  const PHONE_URL = ""; // phone page link, used only when this file is opened from disk

  const CODE_CH = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";

  function phoneBase() {
    if (/^https?:$/.test(location.protocol)) return new URL(".", location.href).href;
    let saved = ""; try { saved = localStorage.getItem("ceo4day-phone-url") || ""; } catch (e) {}
    return saved || PHONE_URL;
  }
  function joinUrl() {
    const b = phoneBase(); if (!b || !NET.code) return "";
    try { const u = new URL(b); u.searchParams.set("room", NET.code); return u.href; } catch (e) { return ""; }
  }
  function qr() {
    qrImg = ""; const url = joinUrl(), box = $("qrtmp"); if (!url || !window.QRCode) return;

  }

  function netChip() {
    const n = NET.conns.size, el = $("netchip");

    el.textContent = NET.status === "ok" ? `Join code ${NET.code} · ${n} phone${n === 1 ? "" : "s"}` : NET.status === "bad" ? "Phones offline · play by hand" : "Phones: connecting…";
  }
  function netInit() {
    if (!window.Peer) { NET.status = "bad"; netChip(); return; }

    try { NET.peer = new Peer("g5lob-ceo4day-" + NET.code.toLowerCase()); } catch (e) { NET.status = "bad"; netChip(); return; }

  function vStart() {

  }
  function vTeams() {
    return `<div class="eyebrow">The situation · LEGO, 2003–2005</div>
      <h1 class="mega">You are the <span class="y">new CEO</span>.</h1>
      <div class="stats">
        <div class="stat"><b>US$300m</b>lost in 2003</div>
        <div class="stat"><b>Almost</b>out of cash</div>
        <div class="stat"><b>Too many</b>parks, games, jewelry, centers</div>
      </div>
      <div class="joinwrap"><div class="qcard">
        <div class="namegrid">${TEAMS.map((t) => `<label style="--c:${t.c}" for="name-${t.id}">${t.label} team name<input id="name-${t.id}" type="text" maxlength="18" value="${esc(state.names[t.id])}"></label>`).join("")}</div>
        ${/^https?:$/.test(location.protocol) ? "" : `<div class="urlrow"><label for="phoneurl">Phone page link</label><input id="phoneurl" type="url" placeholder="https://yourname.github.io/ceo4day/" value="${esc(phoneBase())}"></div>`}
      </div>${joinCard()}</div>`;
  }
  function joinCard() {
    const url = joinUrl();
    if (NET.status === "ok" && url && qrImg) return `<div class="qrcard"><div class="msg">Spokespeople: scan, then pick your team colour</div><img src="${qrImg}" alt="QR code to join the game"><div class="code">${NET.code}</div><div class="url">${esc(url)}</div></div>`;
    const msg = NET.status === "bad" ? "Phones are offline. Play by hand: fingers up, host enters answers." : NET.status === "ok" ? "Paste the phone page link on the left to show the QR code." : "Connecting phones…";
    return `<div class="qrcard"><div class="msg">${msg}</div>${NET.status === "ok" ? `<div class="code">${NET.code}</div>` : ""}</div>`;
  }
  function vLintro() {
    return `<div class="eyebrow">Round 4 · Lightning · Double points</div>
      <h1 class="mega">LEGO <span class="y">or</span> Nokia?</h1>
      <p class="lede">Four statements. Ten seconds each. Tap LEGO or NOKIA. One company used power through fear. The other asked its fans for ideas.</p>`;
  }
  function vQ(st) {
    const q = Q[st.i], rev = state.phase === "reveal", a = state.answers[st.i] || {};
    const opts = q.opts.map((o, k) => {
      const who = TEAMS.filter((t) => a[t.id] && a[t.id].o === k).map((t) => `<i style="--c:${t.c}" title="${esc(state.names[t.id])}"></i>`).join("");
      const cls = rev ? (k === q.correct ? "right" : "dim") : "";
      return `<div class="opt ${cls}"><span class="n">${q.lightning ? (k + 1) : k + 1}</span><span>${esc(o)}</span><span class="who">${rev ? who : ""}</span></div>`;
    }).join("");
    const head = headOf(q);
    const fact = rev ? `<div class="fact"><span class="tag">${esc(q.tag)}</span><div><p>${esc(q.fact)}</p><p>${esc(q.theory)}</p><small>Source: ${esc(q.src)}</small></div></div>` : "";
    return `<div class="qwrap"><div class="qcard">
        <div class="eyebrow">${esc(head)}</div>
        <h2 class="qtext">${q.lightning ? "“" + esc(q.q) + "”" : esc(q.q)}</h2>
        <div class="opts ${q.lightning ? "lightning-opts" : ""}">${opts}</div>
      </div>
      <div class="ring" id="ring"><svg viewBox="0 0 128 128" aria-hidden="true"><circle class="track" cx="64" cy="64" r="54"></circle><circle class="bar" cx="64" cy="64" r="54" stroke-dasharray="${(2 * Math.PI * 54).toFixed(2)}" stroke-dashoffset="0"></circle></svg><div class="num">${q.time}</div><div class="cap">${{ ask: "ready", timing: "seconds", closed: "time!", rolling: "…", reveal: "answer" }[state.phase]}</div></div>
      </div>${fact}`;
  }
  function vPodium() {
    const sc = scores();
    const ranked = TEAMS.map((t) => ({ ...t, s: sc[t.id] })).sort((x, y) => y.s - x.s);
    const placeOf = (i) => 1 + ranked.findIndex((r) => r.s === ranked[i].s);
    const slot = (i, h) => { const r = ranked[i]; return `<div class="place"><div class="pn">${esc(state.names[r.id])}</div><div class="ps">${r.s}</div><div class="blk" style="--c:${r.c};height:${h}px">${placeOf(i)}</div></div>`; };
    return `<div class="eyebrow" style="text-align:center">Final scores</div>
      <h1 class="mega" style="text-align:center">Best <span class="y">CEOs</span></h1>
      <div class="podium">${slot(1, 150)}${slot(0, 220)}${slot(2, 110)}</div>
      <div class="also">${esc(state.names[ranked[3].id])}: ${ranked[3].s} points. Every CEO survives the crisis today.</div>`;
  }
  function vBridge() {
    return `<div class="eyebrow">Now the theory</div>
      <h1 class="mega">You made three <span class="y">CEO decisions</span>.</h1>
      <p class="lede">LEGO made the same three choices in 2004. Today, three chapters explain why they worked.</p>
      <div class="chips">
        <div class="chip"><b>KA11</b>Decision making &amp; creativity · Ahmad</div>
        <div class="chip"><b>KA12</b>Power, influence &amp; politics · Hung</div>
        <div class="chip"><b>KA13</b>Leadership effectiveness · Sandra</div>
      </div>`;
  }

  // ---------- events ----------
  $("btnNext").addEventListener("click", next);
  $("btnBack").addEventListener("click", back);
  $("btnUndo").addEventListener("click", undo);
  $("btnMute").addEventListener("click", () => setMute(!state.muted));
  $("vol").addEventListener("input", (e) => { state.vol = +e.target.value; if (A.master && !state.muted) A.master.gain.setTargetAtTime(state.vol, A.ctx.currentTime, 0.05); });
  $("btnFull").addEventListener("click", toggleFull);
  function toggleFull() { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} }
  $("stage").addEventListener("click", (e) => { if (e.target.closest("[data-act=next]")) next(); });
  $("teams").addEventListener("click", (e) => { const b = e.target.closest("button[data-team]"); if (b) answer(b.dataset.team, +b.dataset.o); });
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    const k = e.key.toLowerCase();
    if (k === " " || k === "arrowright" || k === "enter") { e.preventDefault(); next(); return; }
    if (k === "arrowleft") { back(); return; }
    if (k === "m") { setMute(!state.muted); return; }
    if (k === "u") { undo(); return; }
    if (k === "s") { skipLightning(); return; }
    if (k === "f") { toggleFull(); return; }
    const t = TEAMS.find((x) => x.key === k);
    if (t && canAnswer()) { state.sel = state.sel === t.id ? null : t.id; renderTeams(); return; }
    if (/^[1-3]$/.test(k) && state.sel) answer(state.sel, +k - 1);
  });

  // ---------- boot (keeps the game state if the page updates while open) ----------
  function start(data) {
    if (data && data.state) { state = { ...state, ...data.state }; if (state.phase === "timing" || state.phase === "rolling") state.phase = "closed"; }
    if (window.claude?.hot?.snapshot) try { window.claude.hot.snapshot(() => ({ state })); } catch (e) {}
    $("btnMute").textContent = state.muted ? "Unmute" : "Mute"; $("vol").value = state.vol;
    render();
    netInit();
  }
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</body></html>
