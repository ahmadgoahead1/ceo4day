<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CEO for a Day · Buzzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Archivo:wght@400;600;800&display=swap">
<style>
/* Phone buzzer for the projector game: one big state at a time, thumb-sized buttons. Same brick palette as the host screen. */
:root {
  --stage: #151b3d;
  --stage-2: #1f2754;
  --stage-3: #2a3468;
  --ink: #f7f4ec;
  --muted: #aeb5dc;
  --red: #e2382f;
  --blue: #2477e0;
  --yellow: #f6c31c;
  --green: #22a35a;
  --gold: #ffd23f;
  --good: #3ad07a;
  --bad: #ff6b5e;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --body: "Archivo", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--stage);
  background-image: radial-gradient(circle at 12px 12px, rgba(255,255,255,.045) 0 7px, transparent 8px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.app {
  min-height: 100vh;
  min-height: 100dvh;
  box-sizing: border-box;
  display: grid;
  grid-template-rows: auto 1fr auto;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
  padding-top: max(16px, env(safe-area-inset-top, 0px));
  padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 560px;
  margin: 0 auto;
}
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-radius: 14px; padding: 12px 14px; background: var(--c, var(--stage-2)); color: #fff; box-shadow: inset 0 -5px 0 rgba(0,0,0,.22); }
.bar.yel { color: #2b2100; }
.bar .nm { font-weight: 800; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.bar .sc { font-family: var(--display); font-size: 24px; white-space: nowrap; }
.main { display: grid; align-content: center; gap: 16px; min-width: 0; }
.eyebrow { font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
h1 { font-family: var(--display); font-size: clamp(30px, 9vw, 44px); line-height: 1; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.q { font-weight: 800; font-size: 19px; line-height: 1.3; margin: 0; }
.muted { color: var(--muted); margin: 0; line-height: 1.4; }
.picks { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pick { border: 0; border-radius: 16px; padding: 28px 10px; background: var(--c); color: #fff; font: 800 20px var(--body); box-shadow: inset 0 -6px 0 rgba(0,0,0,.25); overflow-wrap: anywhere; }
.pick.yel { color: #2b2100; }
.ans { display: grid; gap: 12px; }
.ans button { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; text-align: left; border: 0; border-radius: 16px; padding: 18px 16px; min-height: 76px; background: var(--ink); color: var(--stage); font: 800 18px var(--body); box-shadow: 0 6px 0 #b9b2a0; }
.ans button:active { transform: translateY(4px); box-shadow: 0 2px 0 #b9b2a0; }
.ans button .n { font-family: var(--display); width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--stage); color: var(--gold); font-size: 24px; }
.ans.big button { font-family: var(--display); font-size: 30px; min-height: 120px; }
.ans button:disabled { opacity: .45; cursor: default; transform: none; }
.timer { font-family: var(--display); font-size: 56px; text-align: center; font-variant-numeric: tabular-nums; }
.timer.hot { color: var(--bad); }
.result { border-radius: 20px; padding: 24px 18px; text-align: center; display: grid; gap: 8px; }
.result.good { background: var(--good); color: #08240f; }
.result.bad { background: var(--stage-2); }
.result.wait { background: var(--stage-2); }
.result b { font-family: var(--display); font-size: clamp(32px, 10vw, 48px); line-height: 1; }
.result .big { font-family: var(--display); font-size: 64px; color: var(--gold); line-height: 1; }
.codein { display: flex; gap: 10px; }
.codein input { flex: 1; min-width: 0; font: 400 34px var(--display); letter-spacing: .2em; text-transform: uppercase; text-align: center; padding: 12px; border-radius: 14px; border: 3px solid var(--gold); background: var(--stage-2); color: var(--ink); }
.go { border: 0; border-radius: 14px; padding: 14px 20px; background: var(--gold); color: var(--stage); font: 400 22px var(--display); }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.foot button { background: none; border: 0; color: var(--muted); font-size: 13px; font-weight: 800; text-decoration: underline; padding: 6px 0; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--bad); margin-right: 6px; }
.dot.ok { background: var(--good); }
@media (prefers-reduced-motion: no-preference) { .enter .result, .enter .ans { animation: pop .3s ease both; } @keyframes pop { from { transform: scale(.94); } } }
</style>
</head>
<body>
<div class="app">
  <div class="bar" id="bar"><span class="nm" id="bnm">CEO for a Day</span><span class="sc" id="bsc"></span></div>
  <main class="main" id="main" aria-live="polite"></main>
  <div class="foot"><span id="net"><span class="dot"></span>Connecting…</span><button type="button" id="swap" hidden>Change team</button></div>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
  const TEAMS = [
    { id: "R", label: "Red", c: "var(--red)", cls: "" },
    { id: "B", label: "Blue", c: "var(--blue)", cls: "" },
    { id: "Y", label: "Yellow", c: "var(--yellow)", cls: "yel" },
    { id: "G", label: "Green", c: "var(--green)", cls: "" },
  ];
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t).replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
  const store = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} } };

  let room = (new URLSearchParams(location.search).get("room") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);
  let team = room ? store.get("ceo4day-team-" + room) : null;
  let lastSig = "", peer = null, conn = null, S = null, pending = null, deadline = 0, tickId = null, retry = null;

  // ---------- connection ----------
  function connect() {
    clearTimeout(retry);
    setNet(false, "Connecting…");
    if (!window.Peer) { setNet(false, "Can’t load. Check internet."); return; }
    if (!peer || peer.destroyed) {
      peer = new Peer();
      peer.on("open", openConn);
      peer.on("error", (e) => { if (e.type === "peer-unavailable") setNet(false, "Game not found. Check the code."); else setNet(false, "Reconnecting…"); again(); });
      peer.on("disconnected", () => { try { peer.reconnect(); } catch (e) {} });
    } else if (peer.open) openConn();
  }
  function openConn() {
    if (conn) try { conn.close(); } catch (e) {}
    conn = peer.connect("g5lob-ceo4day-" + room.toLowerCase(), { reliable: true });
    conn.on("open", () => { setNet(true, "Connected · room " + room); if (team) conn.send({ type: "hello", team }); });
    conn.on("data", (d) => { if (d && d.type === "state") { S = d; if (S.kind !== "q" || S.mine !== null || S.phase !== "timing") pending = null; render(); } });
    conn.on("close", () => { setNet(false, "Reconnecting…"); again(); });
    conn.on("error", () => { setNet(false, "Reconnecting…"); again(); });
  }
  function again() { clearTimeout(retry); retry = setTimeout(connect, 2000); }
  function setNet(ok, txt) { $("net").innerHTML = `<span class="dot ${ok ? "ok" : ""}"></span>${esc(txt)}`; }
  const live = () => conn && conn.open;

  // ---------- actions ----------
  function pickTeam(id) {
    team = id; store.set("ceo4day-team-" + room, id);
    if (live()) conn.send({ type: "hello", team });
    render();
  }
  function tap(o) {
    if (!live() || !S || S.kind !== "q" || S.phase !== "timing" || S.mine !== null || pending !== null) return;
    pending = o; conn.send({ type: "answer", qi: S.qi, o });
    try { navigator.vibrate && navigator.vibrate(40); } catch (e) {}
    render();
  }

  // ---------- render ----------
  function teamOf(id) { return TEAMS.find((t) => t.id === id); }
  function render() {
    const t = team && teamOf(team), names = (S && S.names) || {};
    const bar = $("bar");
    bar.style.setProperty("--c", t ? t.c : "var(--stage-2)");
    bar.className = "bar " + (t ? t.cls : "");
    $("bnm").textContent = t ? (names[t.id] || t.label + " Team") : "CEO for a Day";
    $("bsc").textContent = t && S ? S.score + " pts" : "";
    $("swap").hidden = !t;
    clearInterval(tickId); tickId = null;
    const sig = [room, team, S && S.kind, S && S.qi, S && S.phase, S && S.mine, pending].join("|");
    $("main").classList.toggle("enter", sig !== lastSig); lastSig = sig;
    $("main").innerHTML = view(t, names);
    if (S && S.kind === "q" && S.phase === "timing" && S.mine === null && pending === null) {
      deadline = Date.now() + S.left * 1000; tickId = setInterval(drawTimer, 200); drawTimer();
    }
  }
  function drawTimer() {
    const el = $("tm"); if (!el) return;
    const left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    el.textContent = left; el.classList.toggle("hot", left <= 5);
  }
  function view(t, names) {
    if (!room) return `<div class="eyebrow">Join the game</div><h1>Enter the code on the screen</h1>
      <form class="codein" id="codef"><input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" aria-label="Game code"><button class="go" type="submit">Go</button></form>`;
    if (!t) return `<div class="eyebrow">Room ${esc(room)}</div><h1>Which team are you?</h1><p class="muted">Only the spokesperson joins. Tap your team colour.</p>
      <div class="picks">${TEAMS.map((x) => `<button type="button" class="pick ${x.cls}" style="--c:${x.c}" data-team="${x.id}">${esc(names[x.id] || x.label + " Team")}</button>`).join("")}</div>`;
    if (!S) return `<div class="result wait"><b>Joining…</b><p class="muted">Keep this screen open.</p></div>`;
    if (S.kind === "start" || S.kind === "teams") return `<div class="result wait"><b>You’re in!</b><p class="muted">You answer for your team. Talk fast, tap once: the first tap is final.</p></div>`;
    if (S.kind === "lintro") return `<div class="result wait"><b>⚡ Lightning!</b><p class="muted">Double points. LEGO or NOKIA? Ten seconds each.</p></div>`;
    if (S.kind === "podium" || S.kind === "bridge") return `<div class="result ${S.rank === 1 ? "good" : "wait"}"><span>Final place</span><span class="big">#${S.rank}</span><b>${S.score} pts</b><p class="${S.rank === 1 ? "" : "muted"}">${S.rank === 1 ? "Best CEOs in the room!" : "Every CEO survives the crisis today."}</p></div>`;
    // question
    const head = `<div class="eyebrow">${esc(S.head)}</div>`;
    const mine = S.mine !== null ? S.mine : pending;
    const label = (k) => S.lightning ? S.opts[k].toUpperCase() : `${k + 1}. ${S.opts[k]}`;
    if (S.phase === "reveal") {
      const right = S.mine === S.correct;
      return `${head}<div class="result ${right ? "good" : "bad"}"><b>${right ? "Correct!" : S.mine === null ? "No answer" : "Not this time"}</b>
        ${right ? `<span class="big" style="color:inherit">+${S.got}</span>${S.first ? "<span>Fastest right answer!</span>" : ""}` : `<p class="muted">Right answer: ${esc(label(S.correct))}</p>`}
        <p class="${right ? "" : "muted"}">You’re #${S.rank} with ${S.score} pts.</p></div>`;
    }
    if (mine !== null) return `${head}<div class="result wait"><b>Locked in!</b><p>${esc(label(mine))}</p><p class="muted">${S.phase === "timing" ? "Waiting for the other teams…" : "Watch the screen for the answer."}</p></div>`;
    if (S.phase === "closed" || S.phase === "rolling") return `${head}<div class="result bad"><b>Time’s up!</b><p class="muted">Watch the screen for the answer.</p></div>`;
    const open = S.phase === "timing";
    return `${head}<p class="q">${esc(S.q)}</p>
      ${open ? `<div class="timer" id="tm"></div>` : `<p class="muted">Get ready. Buttons unlock when the timer starts.</p>`}
      <div class="ans ${S.lightning ? "big" : ""}">${S.opts.map((o, k) => `<button type="button" data-o="${k}" ${open ? "" : "disabled"}>${S.lightning ? "" : `<span class="n">${k + 1}</span>`}<span>${esc(S.lightning ? o.toUpperCase() : o)}</span></button>`).join("")}</div>`;
  }

  // ---------- events ----------
  $("main").addEventListener("click", (e) => {
    const p = e.target.closest("[data-team]"); if (p) { pickTeam(p.dataset.team); return; }
    const b = e.target.closest("button[data-o]"); if (b) tap(+b.dataset.o);
  });
  $("main").addEventListener("submit", (e) => {
    e.preventDefault();
    const v = ($("code").value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (v.length !== 4) return;
    room = v; team = store.get("ceo4day-team-" + room);
    try { history.replaceState(null, "", "?room=" + room); } catch (err) {}
    render(); connect();
  });
  $("swap").addEventListener("click", () => { team = null; store.set("ceo4day-team-" + room, null); render(); });

  render();
  if (room) connect();
})();
</script>
</body>
</html>
